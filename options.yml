meta:
  version: 1.0.0
options:
  - url: automarket.ui.buySellSliders.scrollWheel.invert
    header: '{{ui.invert-scroll-wheel-to-control-the-buy-sell-sliders-in-the-automarket-ui}}'
    text: '{{ui.when-inverted-scrolling-away-from-you-means-increasing-the-value}}'
    hasHeader: true
    display: UCP2Switch
    category:
      - '{{ui.automarket}}'
      - '{{ui.ui}}'
    contents:
      type: boolean
      value: false
  - url: automarket.logic.marketFee
    header: '{{ui.market-fee-percentage}}'
    text: '{{ui.if-not-zero-buy-expenses-go-up-by-this-percentage-and-sale-income-goes-down-with-this-percentage-for-goods-traded-with-the-automarket}}'
    hasHeader: true
    display: UCP2Slider
    category:
      - '{{ui.automarket}}'
      - '{{ui.market-fee}}'
    contents:
      min: 0
      max: 100
      step: 1
      decimals: 0
      value:
        enabled: false
        sliderValue: 10